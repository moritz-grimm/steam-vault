name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
type: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `steamvault`
        2. Select '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or log output if available.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SteamVault Version
      description: Run `steamvault --version` to find out.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version` to find out.
      placeholder: "v20.0.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      placeholder: "Windows 11 24H2"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant log output from `%APPDATA%/SteamVault/logs`. This will be automatically formatted.
      render: text
    validations:
      required: false
